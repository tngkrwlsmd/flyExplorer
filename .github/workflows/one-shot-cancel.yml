name: One-shot cancel stale self-hosted run

on:
  push:
    branches:
      - control/remote-shell
    paths:
      - .github/workflows/one-shot-cancel.yml

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: windows-2025
    steps:
      - name: Force-cancel stale run
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: "37456490190"
        run: |
          $ErrorActionPreference = "Stop"
          $uri = "https://api.github.com/repos/$env:REPO/actions/runs/$env:RUN_ID/force-cancel"
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json"; "X-GitHub-Api-Version" = "2022-11-28" }
          Invoke-RestMethod -Method Post -Uri $uri -Headers $headers
          Write-Host "FORCE_CANCEL_REQUESTED=$env:RUN_ID"

name: Remote Windows Task

on:
  push:
    branches:
      - 'remote/**'
    paths:
      - '.github/remote-task.ps1'

permissions:
  contents: read

jobs:
  task:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    steps:
      - name: Checkout remote task branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Run committed remote task
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"
          $script = Join-Path $env:GITHUB_WORKSPACE ".github\remote-task.ps1"
          if (-not (Test-Path -LiteralPath $script -PathType Leaf)) {
            throw "Committed remote task script is missing: $script"
          }
          Write-Host "REMOTE_TASK_BRANCH=$env:GITHUB_REF_NAME"
          Write-Host "REMOTE_TASK_SHA=$env:GITHUB_SHA"
          & $script
          if ($LASTEXITCODE -ne 0) {
            throw "Remote task native command exited with code $LASTEXITCODE."
          }

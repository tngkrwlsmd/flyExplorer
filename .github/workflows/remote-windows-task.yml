name: Remote Windows Task Implementation

on:
  workflow_call:
    inputs:
      request_ref:
        description: Control-branch request commit SHA
        required: true
        type: string
      request_branch:
        description: Branch carrying the request commit
        required: true
        type: string
  workflow_dispatch:
    inputs:
      command:
        description: PowerShell command to execute on the flyExplorer Windows VM
        required: true
        type: string
      working_directory:
        description: Optional working-directory override; blank uses the canonical persistent checkout
        required: false
        type: string

permissions:
  contents: read

env:
  FLYEXPLORER_CANONICAL_CHECKOUT: 'C:\dev\flyExplorer'
  FLYEXPLORER_ROUTINE_OBSERVATION_SECONDS: '30'
  FLYEXPLORER_ACTIVE_MONITOR_SECONDS: '30'
  FLYEXPLORER_RESULT_DEPENDENT_MAX_WAIT_SECONDS: '180'
  FLYEXPLORER_REMOTE_RUNNER_CAPACITY: '1'
  FLYEXPLORER_DEFAULT_VALIDATION_RUN_BUDGET: '2'

concurrency:
  group: flyexplorer-remote-windows-task
  cancel-in-progress: false

jobs:
  task:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    steps:
      - name: Checkout control branch request
        if: inputs.request_ref != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.request_ref }}

      - name: Resolve request-slot inputs
        id: request
        if: inputs.request_ref != ''
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          INPUT_REQUEST_BRANCH: ${{ inputs.request_branch }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:INPUT_REQUEST_BRANCH -ne "control/remote-shell") {
            throw "Remote shell reusable workflow only accepts control/remote-shell requests."
          }

          $requestPath = Join-Path $env:GITHUB_WORKSPACE "requests\remote-shell\request.json"
          if (-not (Test-Path -LiteralPath $requestPath -PathType Leaf)) {
            throw "Remote shell request is missing: $requestPath"
          }
          $request = Get-Content -Raw -Encoding UTF8 -LiteralPath $requestPath | ConvertFrom-Json

          $requestId = ([string]$request.request_id).Trim()
          $expectedMainSha = ([string]$request.expected_main_sha).Trim().ToLowerInvariant()
          $candidateSha = ([string]$request.candidate_sha).Trim().ToLowerInvariant()
          $logicalUnit = ([string]$request.logical_unit).Trim()
          $configuration = ([string]$request.configuration).Trim()
          $requestMode = ([string]$request.request_mode).Trim().ToLowerInvariant()
          $command = [string]$request.command
          $workdir = [string]$request.working_directory
          $retryReason = ([string]$request.retry_reason).Trim()
          $harnessRevision = ([string]$request.harness_revision).Trim()

          if ([string]::IsNullOrWhiteSpace($requestMode)) {
            $legacyKinds = @(
              $request.validation_kind |
                ForEach-Object { ([string]$_).Trim().ToLowerInvariant() }
            )
            if ($legacyKinds.Count -eq 1 -and $legacyKinds[0] -eq "none") {
              $requestMode = "diagnostic"
              $validationPlan = @()
            } else {
              $requestMode = "validation"
              $validationPlan = @($legacyKinds)
            }
          } else {
            if ($null -ne $request.validation_kind) {
              throw "New request_mode schema must not also declare validation_kind."
            }
            $validationPlan = @(
              $request.validation_plan |
                ForEach-Object { ([string]$_).Trim().ToLowerInvariant() }
            )
          }

          if ([string]::IsNullOrWhiteSpace($requestId)) {
            throw "Remote shell request_id is required."
          }
          if ($expectedMainSha -notmatch '^[0-9a-f]{40}$') {
            throw "Remote shell expected_main_sha must be a 40-character Git SHA."
          }
          if ($candidateSha -notmatch '^[0-9a-f]{40}$') {
            throw "Remote shell candidate_sha must be a 40-character Git SHA."
          }
          if ($logicalUnit -notmatch '^[A-Za-z0-9][A-Za-z0-9._/-]{1,95}$') {
            throw "Remote shell logical_unit must be a stable 2-96 character identifier."
          }
          if ($requestMode -notin @("diagnostic", "validation")) {
            throw "Remote shell request_mode must be diagnostic or validation."
          }
          if ($configuration -notin @("none", "Debug", "Release")) {
            throw "Remote shell configuration must be none, Debug or Release."
          }
          if ([string]::IsNullOrWhiteSpace($command)) {
            throw "Remote shell command is required."
          }
          if ($retryReason.Contains([char]13) -or $retryReason.Contains([char]10)) {
            throw "Remote shell retry_reason must be a single line."
          }
          if ([string]::IsNullOrWhiteSpace($harnessRevision)) {
            $harnessRevision = $candidateSha
          }
          if ($harnessRevision -notmatch '^[A-Za-z0-9][A-Za-z0-9._:/-]{0,127}$') {
            throw "Remote shell harness_revision has an invalid identifier."
          }

          $planInvalid = @(
            $validationPlan |
              Where-Object { $_ -notmatch '^[A-Za-z0-9][A-Za-z0-9._/-]{0,95}$' }
          )
          if ($planInvalid.Count -ne 0) {
            throw "Remote shell validation_plan contains invalid logical targets."
          }
          $uniquePlan = @($validationPlan | Sort-Object -Unique)
          if ($uniquePlan.Count -ne $validationPlan.Count) {
            throw "Remote shell validation_plan must not contain duplicate targets."
          }

          if ($requestMode -eq "diagnostic") {
            if ($configuration -ne "none") {
              throw "Diagnostic requests must use configuration none."
            }
            if ($validationPlan.Count -ne 0) {
              throw "Diagnostic requests must leave validation_plan empty."
            }
          } else {
            if ($configuration -notin @("Debug", "Release")) {
              throw "Validation requests must declare Debug or Release configuration."
            }
            if ($validationPlan.Count -eq 0) {
              throw "Validation requests must declare validation_plan."
            }
          }

          if ([string]::IsNullOrWhiteSpace($workdir)) {
            $workdir = $env:FLYEXPLORER_CANONICAL_CHECKOUT
          }

          & git fetch origin main --no-tags --prune
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to refresh origin/main before remote shell execution."
          }
          $observedMainSha = (& git rev-parse refs/remotes/origin/main).Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0 -or $observedMainSha -notmatch '^[0-9a-f]{40}$') {
            throw "Failed to resolve the current origin/main SHA."
          }
          if ($observedMainSha -ne $expectedMainSha) {
            if ($requestMode -eq "validation") {
              throw "Stale validation request: expected main $expectedMainSha but current main is $observedMainSha."
            }
            Write-Host "DIAGNOSTIC_STALE_MAIN=ADVISORY expected=$expectedMainSha observed=$observedMainSha"
          }

          $normalizedCommand = ($command -replace '\s+', ' ').Trim()
          $sha256 = [System.Security.Cryptography.SHA256]::Create()
          try {
            $commandBytes = [System.Text.Encoding]::UTF8.GetBytes($normalizedCommand)
            $commandHash = ([BitConverter]::ToString($sha256.ComputeHash($commandBytes))).Replace("-", "").ToLowerInvariant()
            $fingerprintSeed = @(
              $candidateSha
              $configuration
              $logicalUnit
              ($uniquePlan -join ",")
              $commandHash
              $harnessRevision
            ) -join "|"
            $seedBytes = [System.Text.Encoding]::UTF8.GetBytes($fingerprintSeed)
            $validationFingerprint = ([BitConverter]::ToString($sha256.ComputeHash($seedBytes))).Replace("-", "").ToLowerInvariant()
          } finally {
            $sha256.Dispose()
          }

          $delimiter = "FLY_REMOTE_" + [guid]::NewGuid().ToString("N")
          @(
            "REMOTE_REQUEST_ID=$requestId"
            "REMOTE_SOURCE=control/remote-shell"
            "REMOTE_REQUEST_MODE=$requestMode"
            "REMOTE_EXPECTED_MAIN_SHA=$expectedMainSha"
            "REMOTE_OBSERVED_MAIN_SHA=$observedMainSha"
            "REMOTE_CANDIDATE_SHA=$candidateSha"
            "REMOTE_LOGICAL_UNIT=$logicalUnit"
            "REMOTE_CONFIGURATION=$configuration"
            "REMOTE_VALIDATION_PLAN=$($uniquePlan -join ',')"
            "REMOTE_VALIDATION_FINGERPRINT=$validationFingerprint"
            "REMOTE_HARNESS_REVISION=$harnessRevision"
            "REMOTE_RETRY_REASON=$retryReason"
            "REMOTE_COMMAND<<$delimiter"
            $command
            $delimiter
            "REMOTE_WORKDIR<<$delimiter"
            $workdir
            $delimiter
          ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "REQUEST_VALIDATION=PASS mode=$requestMode plan=$($uniquePlan -join ',')"
          Write-Host "VALIDATION_FINGERPRINT=$validationFingerprint"

      - name: Resolve dispatched shell inputs
        id: dispatch
        if: github.event_name == 'workflow_dispatch'
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          INPUT_COMMAND: ${{ inputs.command }}
          INPUT_WORKDIR: ${{ inputs.working_directory }}
        run: |
          $delimiter = "FLY_REMOTE_" + [guid]::NewGuid().ToString("N")
          @(
            "REMOTE_REQUEST_ID=workflow-dispatch-$env:GITHUB_RUN_ID"
            "REMOTE_SOURCE=workflow_dispatch"
            "REMOTE_REQUEST_MODE=diagnostic"
            "REMOTE_VALIDATION_PLAN="
            "REMOTE_COMMAND<<$delimiter"
            $env:INPUT_COMMAND
            $delimiter
            "REMOTE_WORKDIR<<$delimiter"
            $env:INPUT_WORKDIR
            $delimiter
          ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "REQUEST_VALIDATION=PASS mode=diagnostic dispatch=true"

      - name: Static candidate preflight
        id: preflight
        if: inputs.request_ref != ''
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:REMOTE_REQUEST_MODE -ne "validation") {
            Write-Host "STATIC_PREFLIGHT=SKIPPED_DIAGNOSTIC"
            exit 0
          }

          $repo = $env:FLYEXPLORER_CANONICAL_CHECKOUT
          if (-not (Test-Path -LiteralPath $repo -PathType Container)) {
            throw "Canonical checkout missing before static candidate preflight: $repo"
          }
          Set-Location -LiteralPath $repo
          & git fetch origin --no-tags --prune
          if ($LASTEXITCODE -ne 0) {
            throw "Static candidate preflight could not refresh repository refs."
          }
          & git cat-file -e "$($env:REMOTE_CANDIDATE_SHA)^{commit}"
          if ($LASTEXITCODE -ne 0) {
            throw "Static candidate preflight could not resolve candidate commit."
          }

          $temp = Join-Path $env:RUNNER_TEMP ("fly-static-preflight-" + $env:GITHUB_RUN_ID)
          if (Test-Path -LiteralPath $temp) {
            Remove-Item -LiteralPath $temp -Recurse -Force
          }
          try {
            & git worktree add --detach $temp $env:REMOTE_CANDIDATE_SHA
            if ($LASTEXITCODE -ne 0) {
              throw "Static candidate preflight could not create candidate worktree."
            }

            & git -C $temp diff --check "$($env:REMOTE_EXPECTED_MAIN_SHA)..$($env:REMOTE_CANDIDATE_SHA)"
            if ($LASTEXITCODE -ne 0) {
              throw "Static candidate diff --check failed."
            }

            $changedPaths = @(
              & git -C $temp diff --name-only "$($env:REMOTE_EXPECTED_MAIN_SHA)..$($env:REMOTE_CANDIDATE_SHA)"
            )
            $pythonFiles = @(
              $changedPaths |
                Where-Object {
                  $_ -match '\.py$' -and
                  ($_ -like 'tools/winui/*' -or $_ -like 'tests/winui/*')
                } |
                ForEach-Object { Join-Path $temp $_ } |
                Where-Object { Test-Path -LiteralPath $_ -PathType Leaf }
            )

            if ($pythonFiles.Count -gt 0) {
              $checker = Join-Path $temp "tools\winui\check_python_static.py"
              if (Test-Path -LiteralPath $checker -PathType Leaf) {
                & python -X utf8 $checker @pythonFiles
              } else {
                & python -X utf8 -m py_compile @pythonFiles
              }
              if ($LASTEXITCODE -ne 0) {
                throw "Changed Python static check failed."
              }
            }

            $infraChanged = @(
              $changedPaths |
                Where-Object {
                  $_ -in @(
                    '.github/workflows/remote-windows-task.yml',
                    '.github/workflows/windows-build.yml',
                    'tools/winui/validate_remote_request.py',
                    'tools/winui/run_checks.py',
                    'tests/winui/test_remote_request_preflight_contract.py',
                    'tests/winui/test_remote_windows_task_contract.py'
                  )
                }
            )
            if ($infraChanged.Count -gt 0) {
              foreach ($name in @(
                'test_remote_request_preflight_contract.py',
                'test_remote_windows_task_contract.py'
              )) {
                & python -X utf8 (Join-Path $temp "tests\winui\${D}name")
                if ($LASTEXITCODE -ne 0) {
                  throw "Infrastructure policy contract failed: $name"
                }
              }
            }

            $harnessChanged = @(
              $changedPaths |
                Where-Object {
                  $_ -eq 'tests/winui/test_gui_harness_contract.py' -or
                  $_ -eq 'tests/winui/test_high_contrast_gui.py' -or
                  $_ -like 'tools/winui/high_contrast_*.py' -or
                  $_ -eq 'tools/winui/runner_health.py' -or
                  $_ -eq 'tools/winui/check_python_static.py'
                }
            )
            if ($harnessChanged.Count -gt 0) {
              & python -X utf8 (Join-Path $temp "tests\winui\test_gui_harness_contract.py")
              if ($LASTEXITCODE -ne 0) {
                throw "GUI harness contract failed."
              }
            }

            Write-Host "STATIC_PREFLIGHT=PASS changed=$($changedPaths.Count)"
          } finally {
            Set-Location -LiteralPath $repo
            if (Test-Path -LiteralPath $temp) {
              & git worktree remove --force $temp
            }
            & git worktree prune
          }

      - name: Runner health for GUI validation
        id: health
        if: ${{ inputs.request_ref != '' && env.REMOTE_REQUEST_MODE == 'validation' && (contains(env.REMOTE_VALIDATION_PLAN, 'gui') || contains(env.REMOTE_VALIDATION_PLAN, 'visual') || contains(env.REMOTE_VALIDATION_PLAN, 'high-contrast')) }}
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"
          $repo = $env:FLYEXPLORER_CANONICAL_CHECKOUT
          Set-Location -LiteralPath $repo
          $temp = Join-Path $env:RUNNER_TEMP ("fly-runner-health-" + $env:GITHUB_RUN_ID)
          if (Test-Path -LiteralPath $temp) {
            Remove-Item -LiteralPath $temp -Recurse -Force
          }
          try {
            & git worktree add --detach $temp $env:REMOTE_CANDIDATE_SHA
            if ($LASTEXITCODE -ne 0) {
              throw "Runner health could not create candidate worktree."
            }
            & python -X utf8 (Join-Path $temp "tools\winui\runner_health.py") --configuration $env:REMOTE_CONFIGURATION --check
            if ($LASTEXITCODE -ne 0) {
              throw "Runner health check failed."
            }
          } finally {
            Set-Location -LiteralPath $repo
            if (Test-Path -LiteralPath $temp) {
              & git worktree remove --force $temp
            }
            & git worktree prune
          }

      - name: Run remote shell command
        id: command
        if: inputs.request_ref != '' || github.event_name == 'workflow_dispatch'
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"
          $workdir = $env:REMOTE_WORKDIR
          if ([string]::IsNullOrWhiteSpace($workdir)) {
            $workdir = $env:FLYEXPLORER_CANONICAL_CHECKOUT
          }
          if (-not (Test-Path -LiteralPath $workdir -PathType Container)) {
            throw "Remote shell working directory does not exist: $workdir"
          }

          Set-Location -LiteralPath $workdir
          $evidenceRoot = Join-Path $env:FLYEXPLORER_CANONICAL_CHECKOUT "logs\remote-evidence"
          New-Item -ItemType Directory -Force -Path $evidenceRoot | Out-Null
          foreach ($classifier in @("high-contrast-result.json", "remote-result.json")) {
            $classifierPath = Join-Path $evidenceRoot $classifier
            Remove-Item -LiteralPath $classifierPath -Force -ErrorAction SilentlyContinue
          }

          Write-Host "===== FLYEXPLORER REMOTE SHELL ====="
          Write-Host "REQUEST_ID: $env:REMOTE_REQUEST_ID"
          Write-Host "REQUEST_SHA: $env:GITHUB_SHA"
          Write-Host "RUNNER: $env:RUNNER_NAME"
          Write-Host "WORKDIR: $(Get-Location)"
          Write-Host "SOURCE: $env:REMOTE_SOURCE"
          Write-Host "MODE: $env:REMOTE_REQUEST_MODE"
          if ($env:REMOTE_SOURCE -eq "control/remote-shell") {
            Write-Host "EXPECTED_MAIN_SHA: $env:REMOTE_EXPECTED_MAIN_SHA"
            Write-Host "OBSERVED_MAIN_SHA: $env:REMOTE_OBSERVED_MAIN_SHA"
            Write-Host "CANDIDATE_SHA: $env:REMOTE_CANDIDATE_SHA"
            Write-Host "LOGICAL_UNIT: $env:REMOTE_LOGICAL_UNIT"
            Write-Host "CONFIGURATION: $env:REMOTE_CONFIGURATION"
            Write-Host "VALIDATION_PLAN: $env:REMOTE_VALIDATION_PLAN"
            Write-Host "VALIDATION_FINGERPRINT: $env:REMOTE_VALIDATION_FINGERPRINT"
            Write-Host "HARNESS_REVISION: $env:REMOTE_HARNESS_REVISION"
          }
          Write-Host "===================================="

          $global:LASTEXITCODE = 0
          Invoke-Expression $env:REMOTE_COMMAND
          if ($LASTEXITCODE -ne 0) {
            throw "Remote shell native command exited with code $LASTEXITCODE."
          }

      - name: Write structured remote result
        if: always()
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = "Continue"
          $evidence = Join-Path $env:FLYEXPLORER_CANONICAL_CHECKOUT "logs\remote-evidence"
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null

          function Convert-Outcome([string]$value) {
            switch ($value) {
              "success" { return "PASS" }
              "failure" { return "FAIL" }
              "skipped" { return "NOT_RUN" }
              default { return $value.ToUpperInvariant() }
            }
          }

          $requestOutcome = if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "${{ steps.dispatch.outcome }}"
          } else {
            "${{ steps.request.outcome }}"
          }
          $preflightOutcome = "${{ steps.preflight.outcome }}"
          $healthOutcome = "${{ steps.health.outcome }}"
          $commandOutcome = "${{ steps.command.outcome }}"

          $failureCategory = $null
          if ($requestOutcome -eq "failure") {
            $failureCategory = "REQUEST_SCHEMA_FAILURE"
          } elseif ($preflightOutcome -eq "failure") {
            $failureCategory = "HELPER_STATIC_FAILURE"
          } elseif ($healthOutcome -eq "failure") {
            $failureCategory = "RUNNER_HEALTH_FAILURE"
          } elseif ($commandOutcome -eq "failure") {
            $failureCategory = "COMMAND_FAILURE"
            $highContrastResult = Join-Path $evidence "high-contrast-result.json"
            if (Test-Path -LiteralPath $highContrastResult -PathType Leaf) {
              try {
                $hc = Get-Content -Raw -Encoding UTF8 -LiteralPath $highContrastResult | ConvertFrom-Json
                if (-not [string]::IsNullOrWhiteSpace([string]$hc.failure_category)) {
                  $failureCategory = [string]$hc.failure_category
                }
              } catch {
                Write-Host "RESULT_CLASSIFICATION_WARN=$($_.Exception.Message)"
              }
            }
          }

          $result = [ordered]@{
            request_id = $env:REMOTE_REQUEST_ID
            request_mode = $env:REMOTE_REQUEST_MODE
            candidate_sha = $env:REMOTE_CANDIDATE_SHA
            logical_unit = $env:REMOTE_LOGICAL_UNIT
            validation_plan = $env:REMOTE_VALIDATION_PLAN
            stages = [ordered]@{
              REQUEST_VALIDATION = Convert-Outcome $requestOutcome
              STATIC_PREFLIGHT = Convert-Outcome $preflightOutcome
              RUNNER_HEALTH = Convert-Outcome $healthOutcome
              COMMAND = Convert-Outcome $commandOutcome
            }
            failure_category = $failureCategory
          }
          $resultPath = Join-Path $evidence "remote-result.json"
          $result | ConvertTo-Json -Depth 6 |
            Set-Content -LiteralPath $resultPath -Encoding UTF8
          Write-Host "REMOTE_RESULT=$($result | ConvertTo-Json -Compress -Depth 6)"

      - name: Upload remote evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flyexplorer-remote-evidence-${{ github.run_id }}
          path: ${{ env.FLYEXPLORER_CANONICAL_CHECKOUT }}\logs\remote-evidence\
          if-no-files-found: ignore
          retention-days: 3

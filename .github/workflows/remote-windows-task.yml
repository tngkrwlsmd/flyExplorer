          $temp = Join-Path $env:RUNNER_TEMP ("fly-runner-health-" + $env:GITHUB_RUN_ID)
          if (Test-Path -LiteralPath $temp) {
            Remove-Item -LiteralPath $temp -Recurse -Force
          }
          try {
            & git worktree add --detach $temp $env:REMOTE_CANDIDATE_SHA
            if ($LASTEXITCODE -ne 0) {
              throw "Runner health could not create candidate worktree."
            }
            & python -X utf8 (Join-Path $temp "tools\winui\runner_health.py") --configuration $env:REMOTE_CONFIGURATION --check
            if ($LASTEXITCODE -ne 0) {
              throw "Runner health check failed."
            }
          } finally {
            Set-Location -LiteralPath $repo
            if (Test-Path -LiteralPath $temp) {
              & git worktree remove --force $temp
            }
            & git worktree prune
          }

      - name: Run remote shell command
        id: command
        if: inputs.request_ref != '' || github.event_name == 'workflow_dispatch'
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"
          $workdir = $env:REMOTE_WORKDIR
          if ([string]::IsNullOrWhiteSpace($workdir)) {
            $workdir = $env:FLYEXPLORER_CANONICAL_CHECKOUT
          }
          if (-not (Test-Path -LiteralPath $workdir -PathType Container)) {
            throw "Remote shell working directory does not exist: $workdir"
          }

          Set-Location -LiteralPath $workdir
          $evidenceRoot = Join-Path $env:FLYEXPLORER_CANONICAL_CHECKOUT "logs\remote-evidence"
          New-Item -ItemType Directory -Force -Path $evidenceRoot | Out-Null
          foreach ($classifier in @(
            "high-contrast-result.json",
            "remote-result.json",
            "remote-command.log",
            "remote-command-error.txt"
          )) {
            $classifierPath = Join-Path $evidenceRoot $classifier
            Remove-Item -LiteralPath $classifierPath -Force -ErrorAction SilentlyContinue
          }

          Write-Host "===== FLYEXPLORER REMOTE SHELL ====="
          Write-Host "REQUEST_ID: $env:REMOTE_REQUEST_ID"
          Write-Host "REQUEST_SHA: $env:GITHUB_SHA"
          Write-Host "RUNNER: $env:RUNNER_NAME"
          Write-Host "WORKDIR: $(Get-Location)"
          Write-Host "SOURCE: $env:REMOTE_SOURCE"
          Write-Host "MODE: $env:REMOTE_REQUEST_MODE"
          if ($env:REMOTE_SOURCE -eq "control/remote-shell") {
            Write-Host "EXPECTED_MAIN_SHA: $env:REMOTE_EXPECTED_MAIN_SHA"
            Write-Host "OBSERVED_MAIN_SHA: $env:REMOTE_OBSERVED_MAIN_SHA"
            Write-Host "CANDIDATE_SHA: $env:REMOTE_CANDIDATE_SHA"
            Write-Host "LOGICAL_UNIT: $env:REMOTE_LOGICAL_UNIT"
            Write-Host "CONFIGURATION: $env:REMOTE_CONFIGURATION"
            Write-Host "VALIDATION_PLAN: $env:REMOTE_VALIDATION_PLAN"
            Write-Host "VALIDATION_FINGERPRINT: $env:REMOTE_VALIDATION_FINGERPRINT"
            Write-Host "HARNESS_REVISION: $env:REMOTE_HARNESS_REVISION"
          }
          Write-Host "===================================="

          $commandLog = Join-Path $evidenceRoot "remote-command.log"
          $commandError = Join-Path $evidenceRoot "remote-command-error.txt"
          $transcriptStarted = $false
          try {
            try {
              Start-Transcript -LiteralPath $commandLog -Force | Out-Null
              $transcriptStarted = $true
            } catch {
              Write-Host "COMMAND_TRANSCRIPT_WARN=$($_.Exception.Message)"
            }

            $global:LASTEXITCODE = 0
            Invoke-Expression $env:REMOTE_COMMAND
            if ($LASTEXITCODE -ne 0) {
              throw "Remote shell native command exited with code $LASTEXITCODE."
            }
          } catch {
            ($_ | Format-List * -Force | Out-String) |
              Set-Content -LiteralPath $commandError -Encoding UTF8
            throw
          } finally {
            if ($transcriptStarted) {
              try {
                Stop-Transcript | Out-Null
              } catch {
                Write-Host "COMMAND_TRANSCRIPT_STOP_WARN=$($_.Exception.Message)"
              }
            }
          }

      - name: Write structured remote result
        if: always()
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = "Continue"
          $evidence = Join-Path $env:FLYEXPLORER_CANONICAL_CHECKOUT "logs\remote-evidence"
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null

          function Convert-Outcome([string]$value) {
            switch ($value) {
              "success" { return "PASS" }
              "failure" { return "FAIL" }
              "skipped" { return "NOT_RUN" }
              default { return $value.ToUpperInvariant() }
            }
          }

          $requestOutcome = if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "${{ steps.dispatch.outcome }}"
          } else {
            "${{ steps.request.outcome }}"
          }
          $preflightOutcome = "${{ steps.preflight.outcome }}"
          $healthOutcome = "${{ steps.health.outcome }}"
          $commandOutcome = "${{ steps.command.outcome }}"

          function Read-ResultCategory([string]$path) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              return $null
            }
            try {
              $payload = Get-Content -Raw -Encoding UTF8 -LiteralPath $path |
                ConvertFrom-Json
              $value = ([string]$payload.failure_category).Trim()
              if (-not [string]::IsNullOrWhiteSpace($value)) {
                return $value
              }
            } catch {
              Write-Host "RESULT_CLASSIFICATION_WARN=$($_.Exception.Message)"
            }
            return $null
          }

          function Infer-CommandFailure([string]$text) {
            if ([string]::IsNullOrWhiteSpace($text)) {
              return "COMMAND_FAILURE_UNCLASSIFIED"
            }

            $explicit = [regex]::Matches(
              $text,
              'FAILURE_CATEGORY=([A-Z0-9_]+)'
            )
            if ($explicit.Count -gt 0) {
              return $explicit[$explicit.Count - 1].Groups[1].Value
            }

            if ($text -match 'error C\d+|error LNK\d+|error MSB\d+|fatal error C\d+') {
              return "PRODUCT_BUILD_FAILURE"
            }
            if (
              $text -match 'NameError:' -or
              $text -match 'TypeError:.*unexpected keyword argument' -or
              $text -match "UIAWrapper.*has no attribute 'child_window'" -or
              $text -match 'IUIA\.build_condition\(\).*unexpected keyword argument'
            ) {
              return "HARNESS_PROGRAMMING_FAILURE"
            }
            if ($text -match 'NoPatternInterfaceError') {
              return "AUTOMATION_API_FAILURE"
            }
            if ($text -match 'ElementAmbiguousError|ElementNotFoundError') {
              return "AUTOMATION_DISCOVERY_FAILURE"
            }
            if ($text -match 'TimeoutError') {
              return "AUTOMATION_TIMEOUT_FAILURE"
            }
            if ($text -match 'AssertionError:|(?m)^FAIL:|(?m)^FAILED') {
              return "TEST_ASSERTION_FAILURE"
            }
            return "COMMAND_FAILURE_UNCLASSIFIED"
          }

          $failureCategory = $null
          if ($requestOutcome -eq "failure") {
            $failureCategory = "REQUEST_SCHEMA_FAILURE"
          } elseif ($preflightOutcome -eq "failure") {
            $failureCategory = "HELPER_STATIC_FAILURE"
          } elseif ($healthOutcome -eq "failure") {
            $failureCategory = "RUNNER_HEALTH_FAILURE"
          } elseif ($commandOutcome -eq "failure") {
            $failureCategory = Read-ResultCategory (
              Join-Path $evidence "high-contrast-result.json"
            )
            if ([string]::IsNullOrWhiteSpace([string]$failureCategory)) {
              $commandText = @(
                "remote-command.log",
                "remote-command-error.txt"
              ) |
                ForEach-Object {
                  $path = Join-Path $evidence $_
                  if (Test-Path -LiteralPath $path -PathType Leaf) {
                    Get-Content -Raw -Encoding UTF8 -LiteralPath $path
                  }
                }
              $failureCategory = Infer-CommandFailure (
                $commandText -join [Environment]::NewLine
              )
            }
          }

          $validationPlan = @()
          if (-not [string]::IsNullOrWhiteSpace($env:REMOTE_VALIDATION_PLAN)) {
            $validationPlan = @(
              $env:REMOTE_VALIDATION_PLAN -split ',' |
                Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
            )
          }

          $result = [ordered]@{
            request_id = $env:REMOTE_REQUEST_ID
            request_mode = $env:REMOTE_REQUEST_MODE
            candidate_sha = $env:REMOTE_CANDIDATE_SHA
            logical_unit = $env:REMOTE_LOGICAL_UNIT
            validation_plan = $validationPlan
            stages = [ordered]@{
              REQUEST_VALIDATION = Convert-Outcome $requestOutcome
              STATIC_PREFLIGHT = Convert-Outcome $preflightOutcome
              RUNNER_HEALTH = Convert-Outcome $healthOutcome
              COMMAND = Convert-Outcome $commandOutcome
            }
            failure_category = $failureCategory
          }
          $resultPath = Join-Path $evidence "remote-result.json"
          $result | ConvertTo-Json -Depth 6 |
            Set-Content -LiteralPath $resultPath -Encoding UTF8
          Write-Host "REMOTE_RESULT=$($result | ConvertTo-Json -Compress -Depth 6)"

      - name: Upload remote evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:

      - name: Static candidate preflight
        id: preflight
        if: ${{ inputs.request_ref != '' && env.REMOTE_REQUEST_MODE == 'validation' }}
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"
          $repo = $env:FLYEXPLORER_CANONICAL_CHECKOUT
          if (-not (Test-Path -LiteralPath $repo -PathType Container)) {
            throw "Canonical checkout missing before static candidate preflight: $repo"
          }
          Set-Location -LiteralPath $repo
          & git fetch origin --no-tags --prune
          if ($LASTEXITCODE -ne 0) {
            throw "Static candidate preflight could not refresh repository refs."
          }
          & git cat-file -e "$($env:REMOTE_CANDIDATE_SHA)^{commit}"
          if ($LASTEXITCODE -ne 0) {
            throw "Static candidate preflight could not resolve candidate commit."
          }

          $temp = Join-Path $env:RUNNER_TEMP ("fly-static-preflight-" + $env:GITHUB_RUN_ID)
          if (Test-Path -LiteralPath $temp) {
            Remove-Item -LiteralPath $temp -Recurse -Force
          }
          try {
            & git worktree add --detach $temp $env:REMOTE_CANDIDATE_SHA
            if ($LASTEXITCODE -ne 0) {
              throw "Static candidate preflight could not create candidate worktree."
            }

            & git -C $temp diff --check "$($env:REMOTE_EXPECTED_MAIN_SHA)..$($env:REMOTE_CANDIDATE_SHA)"
            if ($LASTEXITCODE -ne 0) {
              throw "Static candidate diff --check failed."
            }

            $changedPaths = @(
              & git -C $temp diff --name-only "$($env:REMOTE_EXPECTED_MAIN_SHA)..$($env:REMOTE_CANDIDATE_SHA)"
            )
            $pythonFiles = @(
              $changedPaths |
                Where-Object {
                  $_ -match '\.py$' -and
                  ($_ -like 'tools/winui/*' -or $_ -like 'tests/winui/*')
                } |
                ForEach-Object { Join-Path $temp $_ } |
                Where-Object { Test-Path -LiteralPath $_ -PathType Leaf }
            )

            if ($pythonFiles.Count -gt 0) {
              $checker = Join-Path $temp "tools\winui\check_python_static.py"
              if (Test-Path -LiteralPath $checker -PathType Leaf) {
                & python -X utf8 $checker @pythonFiles
              } else {
                & python -X utf8 -m py_compile @pythonFiles
              }
              if ($LASTEXITCODE -ne 0) {
                throw "Changed Python static check failed."
              }
            }

            $infraChanged = @(
              $changedPaths |
                Where-Object {
                  $_ -in @(
                    '.github/workflows/remote-windows-task.yml',
                    '.github/workflows/windows-build.yml',
                    'tools/winui/validate_remote_request.py',
                    'tools/winui/run_checks.py',
                    'tests/winui/test_remote_request_preflight_contract.py',
                    'tests/winui/test_remote_windows_task_contract.py'
                  )
                }
            )
            if ($infraChanged.Count -gt 0) {
              foreach ($name in @(
                'test_remote_request_preflight_contract.py',
                'test_remote_windows_task_contract.py'
              )) {
                & python -X utf8 (Join-Path $temp "tests\winui\$name")
                if ($LASTEXITCODE -ne 0) {
                  throw "Infrastructure policy contract failed: $name"
                }
              }
            }

            $harnessChanged = @(
              $changedPaths |
                Where-Object {
                  $_ -eq 'tests/winui/uia_polling.py' -or
                  $_ -like 'tests/winui/test_*gui.py' -or
                  $_ -eq 'tests/winui/test_gui_harness_contract.py' -or
                  $_ -like 'tools/winui/high_contrast_*.py' -or
                  $_ -eq 'tools/winui/runner_health.py' -or
                  $_ -eq 'tools/winui/check_python_static.py'
                }
            )
            if ($harnessChanged.Count -gt 0) {
              & python -X utf8 (Join-Path $temp "tests\winui\test_gui_harness_contract.py")
              if ($LASTEXITCODE -ne 0) {
                throw "GUI harness contract failed."
              }
            }

            Write-Host "STATIC_PREFLIGHT=PASS changed=$($changedPaths.Count)"
          } finally {
            Set-Location -LiteralPath $repo
            if (Test-Path -LiteralPath $temp) {
              & git worktree remove --force $temp
            }
            & git worktree prune
          }


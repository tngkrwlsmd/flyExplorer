name: Remote Windows Task

on:
  push:
    branches:
      - 'control/remote-shell'
    paths:
      - 'requests/remote-shell/request.json'

permissions:
  actions: read
  contents: write

jobs:
  task:
    uses: tngkrwlsmd/flyExplorer/.github/workflows/remote-windows-task.yml@main
    with:
      request_ref: ${{ github.sha }}
      request_branch: ${{ github.ref_name }}

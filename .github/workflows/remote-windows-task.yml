name: Remote Windows Task Implementation

on:
  workflow_call:
    inputs:
      request_ref:
        description: Control-branch request commit SHA
        required: true
        type: string
      request_branch:
        description: Branch carrying the request commit
        required: true
        type: string
  workflow_dispatch:
    inputs:
      command:
        description: PowerShell command to execute on the flyExplorer Windows VM
        required: true
        type: string
      working_directory:
        description: Optional working-directory override; blank uses the canonical persistent checkout
        required: false
        type: string

permissions:
  actions: write
  contents: write

env:
  FLYEXPLORER_CANONICAL_CHECKOUT: 'C:\dev\flyExplorer'

concurrency:
  group: flyexplorer-remote-windows-task
  cancel-in-progress: false

jobs:
  task:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    steps:
      - name: Checkout control branch request
        if: inputs.request_ref != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.request_ref }}

      - name: Resolve request-slot inputs
        id: request
        if: inputs.request_ref != ''
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          INPUT_REQUEST_BRANCH: ${{ inputs.request_branch }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:INPUT_REQUEST_BRANCH -ne "control/remote-shell") {
            throw "Remote shell reusable workflow only accepts control/remote-shell requests."
          }
          $requestPath = Join-Path $env:GITHUB_WORKSPACE "requests\remote-shell\request.json"
          if (-not (Test-Path -LiteralPath $requestPath -PathType Leaf)) {
            throw "Remote shell request is missing: $requestPath"
          }
          $request = Get-Content -Raw -Encoding UTF8 -LiteralPath $requestPath | ConvertFrom-Json
          $requestId = ([string]$request.request_id).Trim()
          $expectedMainSha = ([string]$request.expected_main_sha).Trim().ToLowerInvariant()
          $candidateSha = ([string]$request.candidate_sha).Trim().ToLowerInvariant()
          $logicalUnit = ([string]$request.logical_unit).Trim()
          $configuration = ([string]$request.configuration).Trim()
          $requestMode = ([string]$request.request_mode).Trim().ToLowerInvariant()
          $command = [string]$request.command
          $workdir = [string]$request.working_directory
          $validationPlan = @(
            $request.validation_plan |
              ForEach-Object { ([string]$_).Trim().ToLowerInvariant() }
          )
          if ([string]::IsNullOrWhiteSpace($requestId)) { throw "Remote shell request_id is required." }
          if ($expectedMainSha -notmatch '^[0-9a-f]{40}$') { throw "Remote shell expected_main_sha must be a 40-character Git SHA." }
          if ($candidateSha -notmatch '^[0-9a-f]{40}$') { throw "Remote shell candidate_sha must be a 40-character Git SHA." }
          if ($logicalUnit -notmatch '^[A-Za-z0-9][A-Za-z0-9._/-]{1,95}$') { throw "Remote shell logical_unit must be a stable 2-96 character identifier." }
          if ($requestMode -notin @("diagnostic", "validation")) { throw "Remote shell request_mode must be diagnostic or validation." }
          if ($configuration -notin @("none", "Debug", "Release")) { throw "Remote shell configuration must be none, Debug or Release." }
          if ([string]::IsNullOrWhiteSpace($command)) { throw "Remote shell command is required." }
          foreach ($deprecated in @("validation_kind", "retry_scope", "retry_reason", "harness_revision", "reuse_evidence")) {
            if ($request.PSObject.Properties.Name -contains $deprecated) {
              throw "Deprecated remote control-plane field is not accepted: $deprecated"
            }
          }
          $invalidPlan = @($validationPlan | Where-Object { $_ -notmatch '^[A-Za-z0-9][A-Za-z0-9._/-]{0,95}$' })
          if ($invalidPlan.Count -ne 0) { throw "Remote shell validation_plan contains invalid logical targets." }
          $uniquePlan = @($validationPlan | Sort-Object -Unique)
          if ($uniquePlan.Count -ne $validationPlan.Count) { throw "Remote shell validation_plan must not contain duplicate targets." }
          if ($requestMode -eq "diagnostic") {
            if ($configuration -ne "none") { throw "Diagnostic requests must use configuration none." }
            if ($validationPlan.Count -ne 0) { throw "Diagnostic requests must leave validation_plan empty." }
          } else {
            if ($configuration -notin @("Debug", "Release")) { throw "Validation requests must declare Debug or Release configuration." }
            if ($validationPlan.Count -eq 0) { throw "Validation requests must declare validation_plan." }
          }
          if ([string]::IsNullOrWhiteSpace($workdir)) { $workdir = $env:FLYEXPLORER_CANONICAL_CHECKOUT }
          & git -C $env:FLYEXPLORER_CANONICAL_CHECKOUT fetch origin main --no-tags --prune
          if ($LASTEXITCODE -ne 0) { throw "Failed to refresh origin/main before remote shell execution." }
          $observedMainSha = (& git -C $env:FLYEXPLORER_CANONICAL_CHECKOUT rev-parse refs/remotes/origin/main).Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0 -or $observedMainSha -notmatch '^[0-9a-f]{40}$') { throw "Failed to resolve the current origin/main SHA." }
          if ($observedMainSha -ne $expectedMainSha) {
            if ($requestMode -eq "validation") { throw "Stale validation request: expected main $expectedMainSha but current main is $observedMainSha." }
            Write-Host "DIAGNOSTIC_STALE_MAIN=ADVISORY expected=$expectedMainSha observed=$observedMainSha"
          }
          $needsGuiHealth = @($uniquePlan | Where-Object { $_ -match '(^|[-/])(gui|visual)($|[-/])' -or $_ -match '(^|[-/])high-contrast($|[-/])' }).Count -gt 0
          $delimiter = "FLY_REMOTE_" + [guid]::NewGuid().ToString("N")
          @(
            "REMOTE_REQUEST_ID=$requestId"
            "REMOTE_SOURCE=control/remote-shell"
            "REMOTE_REQUEST_MODE=$requestMode"
            "REMOTE_EXPECTED_MAIN_SHA=$expectedMainSha"
            "REMOTE_OBSERVED_MAIN_SHA=$observedMainSha"
            "REMOTE_CANDIDATE_SHA=$candidateSha"
            "REMOTE_LOGICAL_UNIT=$logicalUnit"
            "REMOTE_CONFIGURATION=$configuration"
            "REMOTE_VALIDATION_PLAN=$($uniquePlan -join ',')"
            "REMOTE_NEEDS_GUI_HEALTH=$($needsGuiHealth.ToString().ToLowerInvariant())"
            "REMOTE_COMMAND<<$delimiter"
            $command
            $delimiter
            "REMOTE_WORKDIR<<$delimiter"
            $workdir
            $delimiter
          ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "REQUEST_VALIDATION=PASS mode=$requestMode plan=$($uniquePlan -join ',')"

      - name: Resolve dispatched shell inputs
        id: dispatch
        if: github.event_name == 'workflow_dispatch'
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          INPUT_COMMAND: ${{ inputs.command }}
          INPUT_WORKDIR: ${{ inputs.working_directory }}
        run: |
          $delimiter = "FLY_REMOTE_" + [guid]::NewGuid().ToString("N")
          @(
            "REMOTE_REQUEST_ID=workflow-dispatch-$env:GITHUB_RUN_ID"
            "REMOTE_SOURCE=workflow_dispatch"
            "REMOTE_REQUEST_MODE=diagnostic"
            "REMOTE_VALIDATION_PLAN="
            "REMOTE_NEEDS_GUI_HEALTH=false"
            "REMOTE_COMMAND<<$delimiter"
            $env:INPUT_COMMAND
            $delimiter
            "REMOTE_WORKDIR<<$delimiter"
            $env:INPUT_WORKDIR
            $delimiter
          ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "REQUEST_VALIDATION=PASS mode=diagnostic dispatch=true"

      - name: Static candidate preflight
        id: preflight
        if: ${{ inputs.request_ref != '' && env.REMOTE_REQUEST_MODE == 'validation' }}
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"
          $repo = $env:FLYEXPLORER_CANONICAL_CHECKOUT
          $evidence = Join-Path $repo "logs\remote-evidence"
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          $checkResult = Join-Path $evidence "check-result.json"
          $preflightLog = Join-Path $evidence "static-preflight.log"
          Remove-Item -LiteralPath $checkResult -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $preflightLog -Force -ErrorAction SilentlyContinue
          $env:FLYEXPLORER_CHECK_RESULT_PATH = $checkResult
          Set-Location -LiteralPath $repo
          & git fetch origin --no-tags --prune
          if ($LASTEXITCODE -ne 0) { throw "Static candidate preflight could not refresh repository refs." }
          & git cat-file -e "$($env:REMOTE_CANDIDATE_SHA)^{commit}"
          if ($LASTEXITCODE -ne 0) { throw "Static candidate preflight could not resolve candidate commit." }
          $temp = Join-Path $env:RUNNER_TEMP ("fly-static-preflight-" + $env:GITHUB_RUN_ID)
          if (Test-Path -LiteralPath $temp) { Remove-Item -LiteralPath $temp -Recurse -Force }
          try {
            & git worktree add --detach $temp $env:REMOTE_CANDIDATE_SHA
            if ($LASTEXITCODE -ne 0) { throw "Static candidate preflight could not create candidate worktree." }
            $fastOutput = & python -X utf8 (Join-Path $temp "tools\winui\run_checks.py") fast --before $env:REMOTE_EXPECTED_MAIN_SHA --head $env:REMOTE_CANDIDATE_SHA 2>&1
            $fastCode = $LASTEXITCODE
            $fastOutput | Tee-Object -FilePath $preflightLog
            if ($fastCode -ne 0) { throw "Change-scoped FAST preflight failed." }
          } finally {
            Set-Location -LiteralPath $repo
            if (Test-Path -LiteralPath $temp) { & git worktree remove --force $temp }
            & git worktree prune
          }

      - name: Runner health for GUI validation
        id: health
        if: ${{ inputs.request_ref != '' && env.REMOTE_REQUEST_MODE == 'validation' && env.REMOTE_NEEDS_GUI_HEALTH == 'true' }}
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"
          $repo = $env:FLYEXPLORER_CANONICAL_CHECKOUT
          Set-Location -LiteralPath $repo
          $temp = Join-Path $env:RUNNER_TEMP ("fly-runner-health-" + $env:GITHUB_RUN_ID)
          if (Test-Path -LiteralPath $temp) {
            Remove-Item -LiteralPath $temp -Recurse -Force
          }
          try {
            & git worktree add --detach $temp $env:REMOTE_CANDIDATE_SHA
            if ($LASTEXITCODE -ne 0) {
              throw "Runner health could not create candidate worktree."
            }
            & python -X utf8 (Join-Path $temp "tools\winui\runner_health.py") --configuration $env:REMOTE_CONFIGURATION --check
            if ($LASTEXITCODE -ne 0) {
              throw "Runner health check failed."
            }
          } finally {
            Set-Location -LiteralPath $repo
            if (Test-Path -LiteralPath $temp) {
              & git worktree remove --force $temp
            }
            & git worktree prune
          }

      - name: Run remote shell command
        id: command
        if: inputs.request_ref != '' || github.event_name == 'workflow_dispatch'
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"
          $workdir = $env:REMOTE_WORKDIR
          if ([string]::IsNullOrWhiteSpace($workdir)) {
            $workdir = $env:FLYEXPLORER_CANONICAL_CHECKOUT
          }
          if (-not (Test-Path -LiteralPath $workdir -PathType Container)) {
            throw "Remote shell working directory does not exist: $workdir"
          }

          Set-Location -LiteralPath $workdir
          $evidenceRoot = Join-Path $env:FLYEXPLORER_CANONICAL_CHECKOUT "logs\remote-evidence"
          New-Item -ItemType Directory -Force -Path $evidenceRoot | Out-Null
          foreach ($classifier in @(
            "check-result.json",
            "high-contrast-result.json",
            "remote-result.json",
            "remote-command.log",
            "remote-command-error.txt"
          )) {
            $classifierPath = Join-Path $evidenceRoot $classifier
            Remove-Item -LiteralPath $classifierPath -Force -ErrorAction SilentlyContinue
          }

          $env:FLYEXPLORER_CHECK_RESULT_PATH = Join-Path $evidenceRoot "check-result.json"

          Write-Host "===== FLYEXPLORER REMOTE SHELL ====="
          Write-Host "REQUEST_ID: $env:REMOTE_REQUEST_ID"
          Write-Host "REQUEST_SHA: $env:GITHUB_SHA"
          Write-Host "RUNNER: $env:RUNNER_NAME"
          Write-Host "WORKDIR: $(Get-Location)"
          Write-Host "SOURCE: $env:REMOTE_SOURCE"
          Write-Host "MODE: $env:REMOTE_REQUEST_MODE"
          if ($env:REMOTE_SOURCE -eq "control/remote-shell") {
            Write-Host "EXPECTED_MAIN_SHA: $env:REMOTE_EXPECTED_MAIN_SHA"
            Write-Host "OBSERVED_MAIN_SHA: $env:REMOTE_OBSERVED_MAIN_SHA"
            Write-Host "CANDIDATE_SHA: $env:REMOTE_CANDIDATE_SHA"
            Write-Host "LOGICAL_UNIT: $env:REMOTE_LOGICAL_UNIT"
            Write-Host "CONFIGURATION: $env:REMOTE_CONFIGURATION"
            Write-Host "VALIDATION_PLAN: $env:REMOTE_VALIDATION_PLAN"
          }
          Write-Host "===================================="

          $commandLog = Join-Path $evidenceRoot "remote-command.log"
          $commandError = Join-Path $evidenceRoot "remote-command-error.txt"
          $remoteScript = Join-Path $env:RUNNER_TEMP ("flyexplorer-remote-command-" + $env:GITHUB_RUN_ID + ".ps1")
          $transcriptStarted = $false
          try {
            try {
              Start-Transcript -LiteralPath $commandLog -Force | Out-Null
              $transcriptStarted = $true
            } catch {
              Write-Host "COMMAND_TRANSCRIPT_WARN=$($_.Exception.Message)"
            }

            Set-Content -LiteralPath $remoteScript -Value $env:REMOTE_COMMAND -Encoding UTF8
            & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File $remoteScript
            $commandCode = $LASTEXITCODE
            if ($commandCode -ne 0) {
              throw "Remote shell command process exited with code $commandCode."
            }
          } catch {
            ($_ | Format-List * -Force | Out-String) |
              Set-Content -LiteralPath $commandError -Encoding UTF8
            throw
          } finally {
            Remove-Item -LiteralPath $remoteScript -Force -ErrorAction SilentlyContinue
            if ($transcriptStarted) {
              try {
                Stop-Transcript | Out-Null
              } catch {
                Write-Host "COMMAND_TRANSCRIPT_STOP_WARN=$($_.Exception.Message)"
              }
            }
          }

      - name: Write structured remote result
        if: always()
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = "Continue"
          $evidence = Join-Path $env:FLYEXPLORER_CANONICAL_CHECKOUT "logs\remote-evidence"
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null

          function Convert-Outcome([string]$value) {
            switch ($value) {
              "success" { return "PASS" }
              "failure" { return "FAIL" }
              "skipped" { return "NOT_RUN" }
              default { return $value.ToUpperInvariant() }
            }
          }

          $requestOutcome = if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "${{ steps.dispatch.outcome }}"
          } else {
            "${{ steps.request.outcome }}"
          }
          $preflightOutcome = "${{ steps.preflight.outcome }}"
          $healthOutcome = "${{ steps.health.outcome }}"
          $commandOutcome = "${{ steps.command.outcome }}"

          function Read-ResultCategory([string]$path) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              return $null
            }
            try {
              $payload = Get-Content -Raw -Encoding UTF8 -LiteralPath $path |
                ConvertFrom-Json
              $value = ([string]$payload.failure_category).Trim()
              if (-not [string]::IsNullOrWhiteSpace($value)) {
                return $value
              }
            } catch {
              Write-Host "RESULT_CLASSIFICATION_WARN=$($_.Exception.Message)"
            }
            return $null
          }

          function Read-ExplicitCategory([string]$text) {
            if ([string]::IsNullOrWhiteSpace($text)) {
              return $null
            }
            $matches = [regex]::Matches($text, '(?m)FAILURE_CATEGORY=([A-Z0-9_]+)')
            if ($matches.Count -gt 0) {
              return $matches[$matches.Count - 1].Groups[1].Value
            }
            return $null
          }

          function Read-EvidenceText([string[]]$names) {
            return (@(
              $names | ForEach-Object {
                $path = Join-Path $evidence $_
                if (Test-Path -LiteralPath $path -PathType Leaf) {
                  Get-Content -Raw -Encoding UTF8 -LiteralPath $path
                }
              }
            ) -join [Environment]::NewLine)
          }

          function Infer-CommandFailure([string]$text) {
            $classifier = Join-Path $env:RUNNER_TEMP ("classify-remote-failure-" + $env:GITHUB_RUN_ID + ".py")
            $tempText = Join-Path $env:RUNNER_TEMP ("remote-failure-" + $env:GITHUB_RUN_ID + ".txt")
            try {
              $revision = $env:REMOTE_OBSERVED_MAIN_SHA
              if ([string]::IsNullOrWhiteSpace($revision)) {
                & git -C $env:FLYEXPLORER_CANONICAL_CHECKOUT fetch origin main --no-tags --prune
                if ($LASTEXITCODE -ne 0) {
                  return "COMMAND_FAILURE_UNCLASSIFIED"
                }
                $revision = (& git -C $env:FLYEXPLORER_CANONICAL_CHECKOUT rev-parse refs/remotes/origin/main).Trim()
              }
              $spec = $revision + ":tools/winui/classify_remote_failure.py"
              & git -C $env:FLYEXPLORER_CANONICAL_CHECKOUT show $spec |
                Set-Content -LiteralPath $classifier -Encoding UTF8
              if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $classifier -PathType Leaf)) {
                Remove-Item -LiteralPath $classifier -Force -ErrorAction SilentlyContinue
                & git -C $env:FLYEXPLORER_CANONICAL_CHECKOUT fetch origin main --no-tags --prune
                if ($LASTEXITCODE -ne 0) {
                  return "COMMAND_FAILURE_UNCLASSIFIED"
                }
                $revision = (& git -C $env:FLYEXPLORER_CANONICAL_CHECKOUT rev-parse refs/remotes/origin/main).Trim()
                $spec = $revision + ":tools/winui/classify_remote_failure.py"
                & git -C $env:FLYEXPLORER_CANONICAL_CHECKOUT show $spec |
                  Set-Content -LiteralPath $classifier -Encoding UTF8
                if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $classifier -PathType Leaf)) {
                  return "COMMAND_FAILURE_UNCLASSIFIED"
                }
                Write-Host "RESULT_CLASSIFIER_FALLBACK=current-main revision=$revision"
              }
              $text | Set-Content -LiteralPath $tempText -Encoding UTF8
              $category = (& python -X utf8 $classifier $tempText | Select-Object -Last 1).Trim()
              if ($LASTEXITCODE -eq 0 -and $category -match '^[A-Z0-9_]+$') {
                return $category
              }
            } catch {
              Write-Host "RESULT_CLASSIFICATION_WARN=$($_.Exception.Message)"
            } finally {
              Remove-Item -LiteralPath $classifier -Force -ErrorAction SilentlyContinue
              Remove-Item -LiteralPath $tempText -Force -ErrorAction SilentlyContinue
            }
            return "COMMAND_FAILURE_UNCLASSIFIED"
          }

          function Resolve-LowerFailure(
            [string[]]$structuredNames,
            [string]$text,
            [string]$fallback
          ) {
            foreach ($name in $structuredNames) {
              $category = Read-ResultCategory (Join-Path $evidence $name)
              if (-not [string]::IsNullOrWhiteSpace([string]$category)) {
                return $category
              }
            }
            $category = Read-ExplicitCategory $text
            if (-not [string]::IsNullOrWhiteSpace([string]$category)) {
              return $category
            }
            $category = Infer-CommandFailure $text
            if ($category -ne "COMMAND_FAILURE_UNCLASSIFIED") {
              return $category
            }
            return $fallback
          }

          $failureCategory = $null
          if ($requestOutcome -eq "failure") {
            $failureCategory = "REQUEST_SCHEMA_FAILURE"
          } elseif ($preflightOutcome -eq "failure") {
            $preflightText = Read-EvidenceText @("static-preflight.log")
            $failureCategory = Resolve-LowerFailure @(
              "check-result.json"
            ) $preflightText "HELPER_STATIC_FAILURE"
          } elseif ($healthOutcome -eq "failure") {
            $failureCategory = "RUNNER_HEALTH_FAILURE"
          } elseif ($commandOutcome -eq "failure") {
            $commandText = Read-EvidenceText @(
              "remote-command.log",
              "remote-command-error.txt"
            )
            $failureCategory = Resolve-LowerFailure @(
              "check-result.json",
              "high-contrast-result.json"
            ) $commandText "COMMAND_FAILURE_UNCLASSIFIED"
          }

          $validationPlan = @()
          if (-not [string]::IsNullOrWhiteSpace($env:REMOTE_VALIDATION_PLAN)) {
            $validationPlan = @(
              $env:REMOTE_VALIDATION_PLAN -split ',' |
                Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
            )
          }

          $result = [ordered]@{
            request_id = $env:REMOTE_REQUEST_ID
            request_mode = $env:REMOTE_REQUEST_MODE
            candidate_sha = $env:REMOTE_CANDIDATE_SHA
            logical_unit = $env:REMOTE_LOGICAL_UNIT
            validation_plan = $validationPlan
            stages = [ordered]@{
              REQUEST_VALIDATION = Convert-Outcome $requestOutcome
              STATIC_PREFLIGHT = Convert-Outcome $preflightOutcome
              RUNNER_HEALTH = Convert-Outcome $healthOutcome
              COMMAND = Convert-Outcome $commandOutcome
            }
            failure_category = $failureCategory
          }
          $resultPath = Join-Path $evidence "remote-result.json"
          $result | ConvertTo-Json -Depth 6 |
            Set-Content -LiteralPath $resultPath -Encoding UTF8
          Write-Host "REMOTE_RESULT=$($result | ConvertTo-Json -Compress -Depth 6)"

      # Serialize Git evidence writes using the existing workflow concurrency lane.
      - name: Checkout repository evidence
        if: always()
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: evidence/remote-windows
          path: __evidence_repo
          fetch-depth: 1
          persist-credentials: true

      - name: Checkout repository evidence tooling
        if: always()
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          path: __evidence_tooling
          fetch-depth: 1
          persist-credentials: false

      - name: Store bounded repository evidence
        if: always()
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          EVIDENCE_PRIOR_JOB_STATE: ${{ job.status }}
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Join-Path $env:GITHUB_WORKSPACE "__evidence_repo"
          $tool = Join-Path $env:GITHUB_WORKSPACE "__evidence_tooling\tools\winui\store_remote_evidence.py"
          $source = Join-Path $env:FLYEXPLORER_CANONICAL_CHECKOUT "logs\remote-evidence"
          if (-not (Test-Path -LiteralPath $tool -PathType Leaf)) { throw "Evidence serializer missing." }
          if (-not (Test-Path -LiteralPath $archive -PathType Container)) { throw "Evidence checkout missing." }
          & python -X utf8 $tool --source $source --destination $archive `
            --run-id "$env:GITHUB_RUN_ID" --repository "$env:GITHUB_REPOSITORY" `
            --workflow-sha "$env:GITHUB_SHA" --attempt "$env:GITHUB_RUN_ATTEMPT" `
            --prior-job-state "$env:EVIDENCE_PRIOR_JOB_STATE"
          if ($LASTEXITCODE -ne 0) { throw "Evidence preparation failed." }
          & git -C $archive config user.name "flyExplorer CI Evidence"
          if ($LASTEXITCODE -ne 0) { throw "Evidence Git name failed." }
          & git -C $archive config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ($LASTEXITCODE -ne 0) { throw "Evidence Git email failed." }
          & git -C $archive add -- "runs/$env:GITHUB_RUN_ID/"
          if ($LASTEXITCODE -ne 0) { throw "Evidence staging failed." }
          & git -C $archive diff --cached --quiet
          $diffCode = $LASTEXITCODE
          if ($diffCode -eq 0) {
            Write-Host "EVIDENCE_REPO_ARCHIVE=UNCHANGED run=$env:GITHUB_RUN_ID"
          } elseif ($diffCode -eq 1) {
            & git -C $archive commit -m "evidence: remote Windows run $env:GITHUB_RUN_ID"
            if ($LASTEXITCODE -ne 0) { throw "Evidence commit failed." }
            & git -C $archive push origin "HEAD:refs/heads/evidence/remote-windows"
            if ($LASTEXITCODE -ne 0) { throw "Evidence push failed." }
            Write-Host "EVIDENCE_REPO_ARCHIVE=PASS run=$env:GITHUB_RUN_ID"
          } else {
            throw "Evidence staged diff failed."
          }

name: Source Validation

# Manual-only by project policy. Every run still requires explicit user approval.
on:
  workflow_dispatch:
    inputs:
      run_ci:
        description: "Explicit user approval required for this individual validation run"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    if: ${{ inputs.run_ci }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Run canonical WinUI source contracts
        run: python tools/winui/run_checks.py source

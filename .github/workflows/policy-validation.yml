name: Source Validation

# Permanent restriction: no GitHub Actions run without explicit user instruction per run.
# No push/PR CI. Keep definitions manual only with default-disabled jobs.
# The static preflight includes deterministic known-regression guards,
# including dialog/resource/DPI-icon, rename/filter/config/updater functional-test, and isolated installer-smoke wiring.
on:
  workflow_dispatch:
    inputs:
      run_ci:
        description: "Explicit user approval required for this individual validation run"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    if: ${{ inputs.run_ci }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Run source invariant and regression preflight
        run: python build/validate_source_invariants.py

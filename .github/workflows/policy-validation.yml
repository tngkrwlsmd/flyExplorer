name: Source Validation

# Temporary Actions budget pause through 2026-09-30.
# No push/PR CI. Manual runs require an explicit budget override.
# The static preflight includes deterministic known-regression guards,
# including direct-CDialog modernization drift, UI resource contracts, and functional-test wiring.
on:
  workflow_dispatch:
    inputs:
      run_ci:
        description: "Budget override: run source validation before 2026-10-01"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    if: ${{ inputs.run_ci }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Run source invariant and regression preflight
        run: python build/validate_source_invariants.py

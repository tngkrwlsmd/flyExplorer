name: Windows VM Validation

# Product/runtime CI runs on the repository-scoped interactive Windows VM.
# Docs/agent-operation-only pushes do not queue this expensive Windows job.
# Main push scope is resolved from the actual changed paths:
#   source-contract-only -> source
#   product/runtime/GUI/build/toolchain/workflow -> release-gui
# Manual dispatch keeps source/release/release-gui/full exactly available.
on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'src/**'
      - 'tests/**'
      - 'tools/winui/**'
      - 'tools/policy/**'
      - 'packaging/**'
      - '.github/workflows/**'
      - 'build.bat'
      - 'run.bat'
      - 'test.bat'
      - 'clean.bat'
      - 'package.bat'
  workflow_dispatch:
    inputs:
      validation_scope:
        description: "Validation scope"
        required: true
        default: "release-gui"
        type: choice
        options:
          - source
          - release
          - release-gui
          - full

permissions:
  contents: read

concurrency:
  group: flyexplorer-windows-vm
  cancel-in-progress: true

jobs:
  windows-vm:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    env:
      REQUESTED_VALIDATION_SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.validation_scope || 'auto' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Source contracts verify the retired MFC baseline stored only in Git history.
          fetch-depth: 0

      - name: Resolve validation scope
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"

          if ($env:REQUESTED_VALIDATION_SCOPE -ne "auto") {
            "VALIDATION_SCOPE=$env:REQUESTED_VALIDATION_SCOPE" |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Host "VALIDATION_SCOPE=$env:REQUESTED_VALIDATION_SCOPE (manual)"
            exit 0
          }

          $event = Get-Content -Raw -LiteralPath $env:GITHUB_EVENT_PATH |
            ConvertFrom-Json
          $before = [string]$event.before
          if ([string]::IsNullOrWhiteSpace($before) -or
              $before -eq ("0" * 40)) {
            $before = git rev-parse "$env:GITHUB_SHA^"
            if ($LASTEXITCODE -ne 0) {
              throw "Unable to resolve the previous main revision."
            }
          }

          $changed = @(git diff --name-only $before $env:GITHUB_SHA)
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to classify changed paths for CI scope."
          }
          if ($changed.Count -eq 0) {
            throw "Push-triggered validation has no changed paths."
          }

          Write-Host "Changed paths:"
          $changed | ForEach-Object { Write-Host "  $_" }

          $sourceOnly = $true
          foreach ($path in $changed) {
            $safeSourceContract =
              $path -match '^tests/winui/test_.*_contract\.py$' -or
              $path -match '^tools/policy/'
            $neutralMetadata =
              $path -match '^docs/' -or
              $path -match '^AGENTS\.md$' -or
              $path -match '^README$' -or
              $path -match '^LICENSE$' -or
              $path -match '^CREDITS$' -or
              $path -match '^\.agent-policy/'
            if (-not $safeSourceContract -and -not $neutralMetadata) {
              $sourceOnly = $false
              break
            }
          }

          $scope = if ($sourceOnly) { "source" } else { "release-gui" }
          "VALIDATION_SCOPE=$scope" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "VALIDATION_SCOPE=$scope (automatic)"

      - name: Prepare CI evidence marker
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "logs" | Out-Null
          (Get-Date).ToUniversalTime().ToString("O") |
            Set-Content -LiteralPath "logs\\ci-run-start.txt" -Encoding utf8
      - name: VM environment preflight
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Runner: $env:RUNNER_NAME"
          Write-Host "Machine: $env:COMPUTERNAME"
          Write-Host "User: $env:USERNAME"
          Write-Host "Scope: $env:VALIDATION_SCOPE"

          $pythonVersion = python -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}.{sys.version_info.micro}')"
          if ($LASTEXITCODE -ne 0) {
            throw "Python is unavailable."
          }
          Write-Host "Python: $pythonVersion"
          if (-not $pythonVersion.StartsWith("3.14.")) {
            throw "flyExplorer VM expects Python 3.14.x; found $pythonVersion"
          }

          if ($env:VALIDATION_SCOPE -ne "source") {
            $msbuild = python -X utf8 tools\winui\resolve_msbuild.py
            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($msbuild)) {
              throw "MSBuild resolver failed."
            }
            if (-not (Test-Path -LiteralPath $msbuild -PathType Leaf)) {
              throw "Resolved MSBuild does not exist: $msbuild"
            }
            Write-Host "MSBuild: $msbuild"
          }

          if ($env:VALIDATION_SCOPE -in @("release-gui", "full")) {
            python -X utf8 tools\winui\check_python_deps.py --gui
            if ($LASTEXITCODE -ne 0) {
              throw "Pinned GUI Python dependencies are incomplete or mismatched."
            }

            $explorer = Get-Process explorer -ErrorAction SilentlyContinue |
              Where-Object { $_.SessionId -eq (Get-Process -Id $PID).SessionId } |
              Select-Object -First 1

            if (-not $explorer) {
              throw "No interactive Explorer desktop found in the runner session."
            }

            Write-Host "Interactive desktop: Session $($explorer.SessionId)"
          }

      - name: Validate vendored agent policy
        shell: cmd
        run: test.bat policy

      - name: Source contracts
        if: ${{ env.VALIDATION_SCOPE == 'source' || env.VALIDATION_SCOPE == 'release' || env.VALIDATION_SCOPE == 'release-gui' }}
        shell: cmd
        run: test.bat source

      - name: Build canonical WinUI Release
        if: ${{ env.VALIDATION_SCOPE == 'release' || env.VALIDATION_SCOPE == 'release-gui' }}
        shell: cmd
        run: build.bat Release

      - name: Run owned Release GUI validation
        if: ${{ env.VALIDATION_SCOPE == 'release-gui' }}
        shell: cmd
        run: python -X utf8 tools\winui\run_checks.py gui --configuration Release

      - name: Run full Debug + Release validation
        if: ${{ env.VALIDATION_SCOPE == 'full' }}
        shell: cmd
        run: python -X utf8 tools\winui\run_checks.py full

      - name: Verify Release runtime set
        if: ${{ env.VALIDATION_SCOPE != 'source' }}
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"
          $dir = "out\winui\Release"
          $required = @(
            "$dir\flyExplorer.exe",
            "$dir\FlyShellIsolationHelper.exe",
            "$dir\flyExplorer.pri",
            "$dir\MainWindow.xbf"
          )

          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing required WinUI artifact: $path"
            }
          }

          Write-Host "Release runtime set: OK"

      - name: Print bounded failure evidence
        if: failure()
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = "Continue"
          $logRoot = "logs\winui-scoped"

          if (-not (Test-Path $logRoot)) {
            Write-Host "No scoped validation logs were created."
            exit 0
          }

          $logs = Get-ChildItem $logRoot -Filter "*.log" -File |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 3

          foreach ($log in $logs) {
            Write-Host ""
            Write-Host "===== $($log.FullName) ====="
            Get-Content $log.FullName -Tail 120
          }

      - name: Collect bounded failure artifacts
        if: ${{ failure() }}
        continue-on-error: true
        shell: cmd
        run: python -X utf8 tools\winui\collect_ci_failure_artifacts.py --marker logs\ci-run-start.txt --scope "%VALIDATION_SCOPE%"

      - name: Upload failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flyexplorer-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: logs/ci-failure-artifacts/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6

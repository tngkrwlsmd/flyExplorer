name: Windows WinUI Build

# Manual-only by project policy. Do not add push/pull_request triggers.
on:
  workflow_dispatch:
    inputs:
      run_ci:
        description: "Explicit user approval required for this individual build"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  release-x64:
    if: ${{ inputs.run_ci }}
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Source contracts
        shell: cmd
        run: test.bat source
      - name: Build canonical WinUI Release
        shell: cmd
        run: build.bat Release
      - name: Verify runtime set
        shell: pwsh
        run: |
          $dir = "app\winui\x64\Release\FlyExplorerWinUIShell"
          $required = @(
            "$dir\FlyExplorerWinUIShell.exe",
            "$dir\FlyShellIsolationHelper.exe",
            "$dir\FlyExplorerWinUIShell.pri",
            "$dir\MainWindow.xbf"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Missing required WinUI artifact: $path" }
          }
